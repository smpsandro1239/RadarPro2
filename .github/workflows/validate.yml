name: Validate RadarPro2

on:
  push:
    branches:
      - feature/intelligence-comparables
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:./radarpro-ci.db
      TURSO_AUTH_TOKEN: ci-placeholder-token
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare CI database
        run: npm run db:push
      - name: Run unit tests
        run: npx vitest run
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
